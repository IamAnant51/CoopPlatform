<!DOCTYPE html>
<html>

<head>
    <title>Service Provider Registration</title>
</head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #222;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .form-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            background-color: #1f4e79;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #163a5c;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>

<body>

    <header>
        <h1>Service Provider Registration</h1>
        <h2>Tell us about yourself.</h2>
        <p>#Offer your skills through Co-op Services.</p>
    </header>
    
    <div class="container">
        <div class="form-card">
            <h2>Profile Registration</h2>

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter you name" placeholder="For example-Rudra Khan">

            <label for="service">Service:</label>
            <select id="service">
                <option>-Select-</option>
                <option value="Plumber">Plumber</option>
                <option value="Electrician">Electrician</option>
                <option value="Carpenter">Carpenter</option>
                <option value="Cleaner">Cleaner</option>
            </select>

            <label for="experience">Years of experience:</label>
            <input type="number" id="experience" placeholder="For example-4">

            <label for="minWage">Expected minimum wage (₹):</label>
            <input type="number" id="minWage" placeholder="For example-400">

            <label for="maxWage">Expected maximum wage (₹):</label>
            <input type="number" id="maxWage" placeholder="For example-700">

            <label for="phone">Phone number:</label>
            <input type="tel" id="phone" placeholder="xxxxxxxxxx">

            <button onclick="registerWorker()">Register</button>

            <p id="message"></p>
            <br>
            <a href="my-profile.html">View my profile</a>            
        </div>
    </div>
    <a href="main.html">← Back to Home</a>
    <br><br><br>
    <script>

    function registerWorker() {

        let worker = {
            name: document.getElementById("name").value,
            service: document.getElementById("service").value,
            experience: document.getElementById("experience").value,
            minWage: document.getElementById("minWage").value,
            maxWage: document.getElementById("maxWage").value,
            phone: document.getElementById("phone").value
        };

        localStorage.setItem("worker", JSON.stringify(worker));
        
        document.getElementById("message").innerText =
            "Hey, Your Registration is successful! Chill.";

    }

    </script>

</body>

</html>
