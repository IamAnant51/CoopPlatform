<!DOCTYPE html>
<html>

<head>
    <title>Find a Service</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .check{
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: left;

        }
        .services {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .service-card {
            background-color: rgb(170, 255, 162);
            width: 180px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #workers {
            margin-top: 30px;
        }

        .worker-card {
            background-color: rgb(255, 172, 172);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <header>
        <h1>Find a Service</h1>
        <p>Select the service you need:</p>
    </header>
    <div class="container">
        <div class="services">
            <div class="service-card">
                <h3>🔧 Plumber</h3>
                <button onclick="showPlumbers()">View plumbers available</button>
            </div>
            <div class="service-card">
                <h3>⚡ Electrician</h3>
                <button>View electricians available</button>
            </div>
            <div class="service-card">
                <h3>🪚 Carpenter</h3>
                <button>View carpenters available</button>
            </div>
            <div class="service-card">
                <h3>🧹 Cleaner</h3>
                <button>View cleaners available</button>
            </div>
        </div>
        <div id="workers"></div>
        <a href="main.html">← Back to Home</a>
    </div>

    <script>

        function showPlumbers() {

            let workers = JSON.parse(localStorage.getItem("workers")) || [];

            let plumbers = workers.filter(function(worker) {
                return worker.service === "Plumber";
            });

            let output = "<h2>Available Plumbers</h2>";

            if (plumbers.length === 0) {
                output += "<p>No plumbers registered yet.</p>";
            }

            plumbers.forEach(function(worker) {

                output += `
                    <div class="worker-card">
                        <h3>${worker.name}</h3>
                        <p>Experience: ${worker.experience} years</p>
                        <p>Expected wage: ₹${worker.minWage}–${worker.maxWage}</p>
                        <p>Phone: ${worker.phone}</p>
                    </div>
                `;

            });

            document.getElementById("workers").innerHTML = output;
        }

    </script>

</body>

</html>
